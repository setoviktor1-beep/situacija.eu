<!DOCTYPE html>
<html lang="lt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Situacija.eu - CRM Valdymo Panelė</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: rgba(17, 24, 39, 0.7);
            --bg-input: #1f2937;
            --primary: #0d9488;
            --primary-hover: #14b8a6;
            --text-light: #f3f4f6;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
            --radius-lg: 1rem;
            --radius-md: 0.5rem;
            --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7);
            --glass-border: rgba(255, 255, 255, 0.05);
            --glass-glow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);

            /* Status Colors */
            --color-new: #3b82f6;
            --color-contacted: #f59e0b;
            --color-done: #10b981;
            --color-archived: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(13, 148, 136, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* Login Overlay */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(10px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            padding: 3rem;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 420px;
            box-shadow: var(--glass-glow);
            text-align: center;
            animation: cardEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-card h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #14b8a6, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-card p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .input-control {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-light);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.2);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.9rem;
            background: var(--primary);
            border: none;
            border-radius: var(--radius-md);
            color: var(--text-light);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(13, 148, 136, 0.3);
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* App Container (Hidden initially) */
        .app-container {
            display: none;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .brand h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand span {
            color: var(--primary-hover);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .user-info {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .btn-logout {
            width: auto;
            padding: 0.5rem 1.2rem;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            box-shadow: none;
            font-size: 0.9rem;
        }

        .btn-logout:hover {
            background: #ef4444;
            color: var(--text-light);
        }

        /* Tab Navigation */
        .tabs-nav {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            background: rgba(17, 24, 39, 0.3);
            padding: 0.4rem;
            border-radius: var(--radius-md);
            width: fit-content;
            border: 1px solid var(--border);
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 0.6rem 1.5rem;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: calc(var(--radius-md) - 0.2rem);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--bg-input);
            color: var(--text-light);
            border: 1px solid var(--border);
        }

        .tab-btn:hover:not(.active) {
            color: var(--text-light);
        }

        /* Tab Content */
        .tab-pane {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-pane.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Requests Grid/List */
        .requests-container {
            display: grid;
            gap: 1.5rem;
        }

        .request-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.5rem 2rem;
            display: grid;
            grid-template-columns: 2fr 3fr 2fr;
            gap: 1.5rem;
            align-items: start;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s ease, transform 0.3s ease;
        }

        .request-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--status-color, var(--color-new));
        }

        .request-card:hover {
            border-color: rgba(13, 148, 136, 0.2);
            transform: scale(1.005);
        }

        .req-meta {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .req-name {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .req-phone {
            font-size: 0.95rem;
            color: var(--primary-hover);
            text-decoration: underline;
        }

        .req-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .req-message {
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.95rem;
            white-space: pre-line;
            max-height: 150px;
            overflow-y: auto;
        }

        .req-actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .status-select {
            padding: 0.5rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-light);
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
        }

        .notes-textarea {
            width: 100%;
            height: 80px;
            padding: 0.5rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-light);
            font-family: inherit;
            font-size: 0.85rem;
            resize: none;
        }

        .btn-delete-req {
            background: rgba(239, 68, 68, 0.05);
            border: 1px solid rgba(239, 68, 68, 0.15);
            color: #f87171;
            padding: 0.5rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            box-shadow: none;
            width: 100%;
        }

        .btn-delete-req:hover {
            background: #ef4444;
            color: var(--text-light);
        }

        /* Gallery Manager styles */
        .gallery-manager {
            display: grid;
            grid-template-columns: 1fr 3fr;
            gap: 2rem;
            align-items: start;
        }

        .upload-sidebar {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow);
        }

        .upload-sidebar h3 {
            margin-bottom: 1.5rem;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .file-drop-area {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-md);
            padding: 2rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
            background: rgba(0,0,0,0.1);
        }

        .file-drop-area.dragover {
            border-color: var(--primary);
            background: rgba(13, 148, 136, 0.05);
        }

        .file-drop-area p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .file-drop-area .icon {
            font-size: 2rem;
            color: var(--primary);
        }

        #file-input {
            display: none;
        }

        .preview-container {
            margin-top: 1rem;
            display: none;
            position: relative;
        }

        .preview-img {
            max-width: 100%;
            max-height: 150px;
            border-radius: var(--radius-md);
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .preview-remove {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            line-height: 20px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* Photos Grid */
        .photos-grid-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .photo-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            position: relative;
        }

        .photo-card:hover {
            border-color: rgba(13, 148, 136, 0.25);
            transform: translateY(-3px);
        }

        .photo-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-bottom: 1px solid var(--border);
        }

        .photo-info {
            padding: 1rem;
        }

        .photo-title {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .photo-category {
            display: inline-block;
            background: rgba(13, 148, 136, 0.1);
            color: var(--primary-hover);
            font-size: 0.75rem;
            padding: 0.1rem 0.5rem;
            border-radius: 10px;
            margin-top: 0.3rem;
            font-weight: 500;
        }

        .btn-delete-photo {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(239, 68, 68, 0.8);
            border: none;
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-delete-photo:hover {
            background: #ef4444;
            transform: scale(1.1);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-light);
            padding: 1rem 1.5rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-width: 350px;
        }

        @keyframes toastIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .gallery-manager {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .request-card {
                grid-template-columns: 1fr;
                padding: 1.5rem;
            }
            .app-container {
                padding: 1rem;
            }
        }
    </style>
</head>

<body>
    <!-- Login Screen -->
    <div class="login-overlay" id="login-overlay">
        <div class="login-card">
            <h2>Situacija.eu CRM</h2>
            <p>Įveskite administratoriaus slaptažodį</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="password">Slaptažodis</label>
                    <input type="password" id="password" class="input-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn">Prisijungti</button>
            </form>
        </div>
    </div>

    <!-- Main CRM App -->
    <div class="app-container" id="app-container">
        <header>
            <div class="brand">
                <h1>Situacija.eu <span>Valdymas</span></h1>
            </div>
            <div class="header-actions">
                <div class="user-info">Prisijungęs kaip: <strong>Administratorius</strong></div>
                <button class="btn btn-logout" id="logout-btn">Atsijungti</button>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <div class="tabs-nav">
            <button class="tab-btn active" data-tab="requests">Klientų Užklausos</button>
            <button class="tab-btn" data-tab="gallery">Galerijos Valdymas</button>
        </div>

        <!-- Tab 1: Requests -->
        <div class="tab-pane active" id="tab-requests">
            <div class="requests-container" id="requests-list">
                <!-- Requests dynamic load -->
                <div style="text-align: center; color: var(--text-muted); padding: 3rem;">Kraunamos užklausos...</div>
            </div>
        </div>

        <!-- Tab 2: Gallery Manager -->
        <div class="tab-pane" id="tab-gallery">
            <div class="gallery-manager">
                <!-- Sidebar Upload Form -->
                <div class="upload-sidebar">
                    <h3>Įkelti naują darbą</h3>
                    <form id="upload-form">
                        <div class="file-drop-area" id="drop-area">
                            <span class="icon">📁</span>
                            <p><strong>Pasirinkite nuotrauką</strong> arba vilkite ją čia</p>
                            <p style="font-size: 0.75rem;">JPG, PNG, WEBP (maks. 10MB)</p>
                            <input type="file" id="file-input" accept="image/*" required>
                        </div>

                        <div class="preview-container" id="preview-box">
                            <img src="" class="preview-img" id="preview-img">
                            <span class="preview-remove" id="preview-remove">&times;</span>
                        </div>

                        <div class="form-group" style="margin-top: 1rem;">
                            <label for="img-category">Kategorija</label>
                            <select id="img-category" class="input-control" style="background: var(--bg-input);">
                                <option value="Vonios kambariai">Vonios kambariai</option>
                                <option value="Virtuvės">Virtuvės</option>
                                <option value="Grindys ir terasos">Grindys ir terasos</option>
                                <option value="Fasadai klinkeriu">Fasadai klinkeriu</option>
                                <option value="Kita">Kita</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="img-title">Pavadinimas (neprivaloma)</label>
                            <input type="text" id="img-title" class="input-control" placeholder="Pvz. Mozaika dušo zonoje">
                        </div>

                        <div class="form-group">
                            <label for="img-desc">Aprašymas (neprivaloma)</label>
                            <input type="text" id="img-desc" class="input-control" placeholder="Pvz. Naudotos 60x60 akmens masės plytelės">
                        </div>

                        <button type="submit" class="btn" id="upload-btn">Įkelti į svetainę</button>
                    </form>
                </div>

                <!-- Photos Grid -->
                <div class="photos-grid-wrapper">
                    <h3>Svetainės galerija</h3>
                    <div class="photos-grid" id="photos-list">
                        <!-- Dynamic list of photos -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? ''
            : (window.location.hostname === '82.25.58.106')
                ? 'http://82.25.58.106'
                : 'https://api.situacija.eu';

        let sessionToken = localStorage.getItem('crm_token') || '';

        // UI Selectors
        const loginOverlay = document.getElementById('login-overlay');
        const appContainer = document.getElementById('app-container');
        const loginForm = document.getElementById('login-form');
        const passwordInput = document.getElementById('password');
        const logoutBtn = document.getElementById('logout-btn');

        const tabButtons = document.querySelectorAll('.tab-btn');
        const tabPanes = document.querySelectorAll('.tab-pane');

        const requestsList = document.getElementById('requests-list');
        const photosList = document.getElementById('photos-list');

        const dropArea = document.getElementById('drop-area');
        const fileInput = document.getElementById('file-input');
        const previewBox = document.getElementById('preview-box');
        const previewImg = document.getElementById('preview-img');
        const previewRemove = document.getElementById('preview-remove');
        const uploadForm = document.getElementById('upload-form');

        // Initial setup
        if (sessionToken) {
            verifySession();
        }

        // Authentication functions
        function verifySession() {
            // Test connection using session token by fetching requests
            fetch(`${API_BASE}/api/requests`, {
                headers: { 'Authorization': `Bearer ${sessionToken}` }
            })
            .then(res => {
                if (res.ok) {
                    showApp();
                } else {
                    localStorage.removeItem('crm_token');
                    sessionToken = '';
                    showLogin();
                }
            })
            .catch(() => {
                showLogin();
            });
        }

        function showApp() {
            loginOverlay.style.opacity = '0';
            loginOverlay.style.transform = 'translateY(-20px)';
            setTimeout(() => {
                loginOverlay.style.display = 'none';
                appContainer.style.display = 'block';
                setTimeout(() => {
                    appContainer.style.opacity = '1';
                }, 50);
                loadRequests();
                loadPhotos();
            }, 500);
        }

        function showLogin() {
            loginOverlay.style.display = 'flex';
            loginOverlay.style.opacity = '1';
            loginOverlay.style.transform = 'translateY(0)';
            appContainer.style.display = 'none';
            appContainer.style.opacity = '0';
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const password = passwordInput.value;
            fetch(`${API_BASE}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            })
            .then(res => {
                if (res.ok) return res.json();
                throw new Error('Neteisingas slaptažodis');
            })
            .then(data => {
                sessionToken = data.token;
                localStorage.setItem('crm_token', sessionToken);
                showApp();
                showToast('Prisijungta sėkmingai!', 'success');
            })
            .catch(err => {
                showToast(err.message, 'error');
            });
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('crm_token');
            sessionToken = '';
            showLogin();
            showToast('Atsijungta', 'info');
        });

        // Tabs Toggle
        tabButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tabButtons.forEach(b => b.classList.remove('active'));
                tabPanes.forEach(p => p.classList.remove('active'));

                btn.classList.add('active');
                const targetTab = btn.getAttribute('data-tab');
                document.getElementById(`tab-${targetTab}`).classList.add('active');
            });
        });

        // Toast Notification System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            
            let color = 'var(--primary)';
            if (type === 'error') color = '#ef4444';
            if (type === 'info') color = '#3b82f6';
            
            toast.style.borderLeftColor = color;
            toast.innerHTML = `
                <span>${type === 'success' ? '✓' : type === 'error' ? '⚠' : 'ℹ'}</span>
                <div>${message}</div>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.transform = 'translateX(120%)';
                toast.style.opacity = '0';
                toast.style.transition = 'all 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // Requests logic
        function loadRequests() {
            fetch(`${API_BASE}/api/requests`, {
                headers: { 'Authorization': `Bearer ${sessionToken}` }
            })
            .then(res => res.json())
            .then(requests => {
                if (requests.length === 0) {
                    requestsList.innerHTML = `
                        <div style="text-align: center; color: var(--text-muted); padding: 3rem;">
                            Nėra gautų klientų užklausų.
                        </div>
                    `;
                    return;
                }

                requestsList.innerHTML = '';
                requests.forEach(req => {
                    const card = document.createElement('div');
                    card.className = 'request-card';
                    
                    let statusColor = 'var(--color-new)';
                    if (req.status === 'contacted') statusColor = 'var(--color-contacted)';
                    if (req.status === 'done') statusColor = 'var(--color-done)';
                    if (req.status === 'archived') statusColor = 'var(--color-archived)';
                    
                    card.style.setProperty('--status-color', statusColor);

                    const dateStr = new Date(req.created_at).toLocaleString('lt-LT');

                    card.innerHTML = `
                        <div class="req-meta">
                            <div class="req-name">${escapeHTML(req.name)}</div>
                            <a href="tel:${req.phone}" class="req-phone">${escapeHTML(req.phone)}</a>
                            <div class="req-date">${dateStr}</div>
                        </div>
                        <div class="req-message">${escapeHTML(req.message || '(Žinutės nėra)')}</div>
                        <div class="req-actions">
                            <select class="status-select" data-id="${req.id}">
                                <option value="new" ${req.status === 'new' ? 'selected' : ''}>Nauja užklausa</option>
                                <option value="contacted" ${req.status === 'contacted' ? 'selected' : ''}>Susisiekta</option>
                                <option value="done" ${req.status === 'done' ? 'selected' : ''}>Atlikta</option>
                                <option value="archived" ${req.status === 'archived' ? 'selected' : ''}>Archyvas</option>
                            </select>
                            <textarea class="notes-textarea" data-id="${req.id}" placeholder="Administratoriaus pastabos, sąmatos skaičiavimai...">${escapeHTML(req.notes || '')}</textarea>
                            <button class="btn-delete-req" data-id="${req.id}">Ištrinti</button>
                        </div>
                    `;
                    requestsList.appendChild(card);
                });

                // Attach events
                document.querySelectorAll('.status-select').forEach(select => {
                    select.addEventListener('change', (e) => {
                        updateRequest(e.target.dataset.id, { status: e.target.value });
                    });
                });

                document.querySelectorAll('.notes-textarea').forEach(textarea => {
                    textarea.addEventListener('blur', (e) => {
                        updateRequest(e.target.dataset.id, { notes: e.target.value });
                    });
                });

                document.querySelectorAll('.btn-delete-req').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        if (confirm('Ar tikrai norite ištrinti šią užklausą?')) {
                            deleteRequest(e.target.dataset.id);
                        }
                    });
                });
            })
            .catch(() => {
                showToast('Nepavyko užkrauti užklausų', 'error');
            });
        }

        function updateRequest(id, payload) {
            fetch(`${API_BASE}/api/requests/${id}`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${sessionToken}`
                },
                body: JSON.stringify(payload)
            })
            .then(res => {
                if (res.ok) {
                    showToast('Išsaugota', 'success');
                    loadRequests(); // Refresh layout to show color change
                } else {
                    showToast('Klaida išsaugant', 'error');
                }
            })
            .catch(() => {
                showToast('Tinklo klaida', 'error');
            });
        }

        function deleteRequest(id) {
            fetch(`${API_BASE}/api/requests/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${sessionToken}` }
            })
            .then(res => {
                if (res.ok) {
                    showToast('Užklausa ištrinta', 'success');
                    loadRequests();
                } else {
                    showToast('Nepavyko ištrinti', 'error');
                }
            })
            .catch(() => {
                showToast('Tinklo klaida', 'error');
            });
        }

        // Gallery/Photos Manager Logic
        function loadPhotos() {
            fetch(`${API_BASE}/api/images`)
            .then(res => res.json())
            .then(photos => {
                if (photos.length === 0) {
                    photosList.innerHTML = `
                        <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem;">
                            Galerijoje nėra nuotraukų.
                        </div>
                    `;
                    return;
                }

                photosList.innerHTML = '';
                photos.forEach(photo => {
                    const card = document.createElement('div');
                    card.className = 'photo-card';
                    card.innerHTML = `
                        <img src="${API_BASE}/images/${photo.filename}" class="photo-img">
                        <button class="btn-delete-photo" data-id="${photo.id}">&times;</button>
                        <div class="photo-info">
                            <div class="photo-title">${escapeHTML(photo.title || 'Be pavadinimo')}</div>
                            <span class="photo-category">${escapeHTML(photo.category)}</span>
                        </div>
                    `;
                    photosList.appendChild(card);
                });

                document.querySelectorAll('.btn-delete-photo').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const target = e.target.closest('.btn-delete-photo');
                        if (confirm('Ar tikrai norite ištrinti šią nuotrauką iš svetainės galerijos?')) {
                            deletePhoto(target.dataset.id);
                        }
                    });
                });
            })
            .catch(() => {
                showToast('Nepavyko užkrauti nuotraukų', 'error');
            });
        }

        function deletePhoto(id) {
            fetch(`${API_BASE}/api/images/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${sessionToken}` }
            })
            .then(res => {
                if (res.ok) {
                    showToast('Nuotrauka sėkmingai pašalinta', 'success');
                    loadPhotos();
                } else {
                    showToast('Nepavyko ištrinti nuotraukos', 'error');
                }
            })
            .catch(() => {
                showToast('Tinklo klaida', 'error');
            });
        }

        // Upload/Files logic
        dropArea.addEventListener('click', () => fileInput.click());

        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropArea.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropArea.classList.remove('dragover');
            }, false);
        });

        dropArea.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                fileInput.files = files;
                handlePreview(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handlePreview(e.target.files[0]);
            }
        });

        function handlePreview(file) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onloadend = () => {
                previewImg.src = reader.result;
                previewBox.style.display = 'block';
                dropArea.style.display = 'none';
            }
        }

        previewRemove.addEventListener('click', (e) => {
            e.stopPropagation();
            fileInput.value = '';
            previewBox.style.display = 'none';
            dropArea.style.display = 'block';
            previewImg.src = '';
        });

        uploadForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const file = fileInput.files[0];
            if (!file) {
                showToast('Pasirinkite failą!', 'error');
                return;
            }

            const category = document.getElementById('img-category').value;
            const title = document.getElementById('img-title').value;
            const description = document.getElementById('img-desc').value;
            const uploadBtn = document.getElementById('upload-btn');

            const formData = new FormData();
            formData.append('image', file);
            formData.append('category', category);
            formData.append('title', title);
            formData.append('description', description);

            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Kraunama...';

            fetch(`${API_BASE}/api/images`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${sessionToken}`
                },
                body: formData
            })
            .then(res => {
                if (res.ok) return res.json();
                return res.json().then(json => { throw new Error(json.error || 'Nepavyko įkelti') });
            })
            .then(data => {
                showToast('Nuotrauka sėkmingai įkelta!', 'success');
                uploadForm.reset();
                previewBox.style.display = 'none';
                dropArea.style.display = 'block';
                previewImg.src = '';
                loadPhotos();
            })
            .catch(err => {
                showToast(err.message, 'error');
            })
            .finally(() => {
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Įkelti į svetainę';
            });
        });

        // Helper: Escape HTML to avoid XSS
        function escapeHTML(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>

</html>
